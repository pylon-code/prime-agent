schema: 1
fork:
  repository: https://github.com/pylon-code/prime-agent
  upstream_repository: https://github.com/PrimeIntellect-ai/prime-agent
  upstream_branch: main
  mirror_branch: main
  product_branch: pylon
  tracking_issue: https://github.com/pylon-code/prime-agent/issues/1
  reviewed_upstream_commit: a903d4b6768f484bd6d459b7b0aa7dee38e461e2
  reviewed_at: 2026-08-30

decisions:
  managed-plan-daemon:
    area: progress
    state: shipped
    owner: pylon-server
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
      - https://github.com/pylon-code/pylon/issues/126
      - https://github.com/pylon-code/pylon/pull/116
    fork_change: none
    upstream_support: Prime extensions can register a todo tool, but the daemon has no native managed-plan event.
    revisit_when:
      - Prime ships a negotiated structured plan event or equivalent managed tool-result contract.
      - Pylon behavioral evaluation shows the full-snapshot model is too noisy or unreliable.

  managed-plan-acp:
    area: progress
    state: gap
    owner: pylon-prime-integration
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    fork_change: candidate
    upstream_support: ACP does not expose a trustworthy Pylon-managed structured plan result.
    revisit_when:
      - Prime adds authenticated extension provenance and structured ACP tool-result metadata.
      - A standard ACP plan protocol becomes available.

  mobile-plan-rendering:
    area: progress
    state: gap
    owner: pylon-client
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    fork_change: none
    upstream_support: not applicable
    revisit_when:
      - Pylon mobile and web share a provider-neutral plan renderer.

  delegated-work-progress:
    area: progress
    state: design
    owner: pylon-client-runtime
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
      - https://github.com/pylon-code/pylon/issues/126
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1700
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1845
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1847
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1859
    fork_change: possible-capability
    upstream_support: Prime exposes separate subagent lifecycle with unified legacy recovery, one child projection, activity-driven quiescence, and single-send remote-message failure containment, but not Pylon's provider-neutral root progress model.
    revisit_when:
      - Root progress can summarize delegated phases without creating one plan row per worker.
      - Prime exposes a stable aggregate delegated-work status where Pylon lacks one.

  background-process-lifecycle:
    area: autonomous-work
    state: gap
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1858
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1882
    fork_change: candidate
    upstream_support: Prime has native background execution, per-command abort ownership, and daemon-close bash draining, but Pylon lacks complete public lifecycle and ownership mapping.
    revisit_when:
      - Prime publishes list, correlation, cancellation, and terminal lifecycle events.


  correlated-prompt-lifecycle:
    area: prompt-ownership
    state: shipped
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/3
      - https://github.com/pylon-code/prime-agent/pull/9
      - https://github.com/pylon-code/prime-agent/pull/12
      - https://github.com/pylon-code/pylon/issues/114
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/800
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1239
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1700
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1756
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1859
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1861
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1864
    fork_change: negotiated-correlated-prompt-lifecycle-v1
    upstream_support: Prime through a903d4b6768f has queue, background, cancellation, reconnect, single-send remote messages, recovery-aware reuse, activity-fenced continuations, owner-checked opens, and event primitives, but no optional contract proving per-prompt ownership, delivery, provenance, terminal usage, and durable generation-scoped recovery together.
    revisit_when:
      - Prime upstream ships an equivalent negotiated lifecycle with exact delivery, provenance, scoped cancellation, recovery, and per-prompt usage guarantees.
      - Pylon can remove the fork contract without weakening stock-Prime fallback behavior.

  heartbeat-projection:
    area: autonomous-work
    state: blocked
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1857
    fork_change: none-yet
    upstream_support: Prime exposes heartbeat list, management, and change APIs and now derives scoped heartbeat state at render time.
    blocker: Pylon needs canonical autonomous occurrence, turn, checkpoint, and active-run ownership.
    revisit_when:
      - The provider-neutral autonomous-work ownership model is implemented.
      - Prime changes heartbeat dispatch or lifecycle APIs.

  scheduled-prompts:
    area: autonomous-work
    state: blocked
    owner: shared
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    fork_change: candidate
    upstream_support: Prime exposes scheduled prompt APIs, but not all Pylon run ownership and history guarantees.
    blocker: Pylon needs canonical occurrence identity, restart adoption, cancellation, outcomes, limits, and checkpoint ownership.
    revisit_when:
      - The provider-neutral autonomous-work ownership model is implemented.
      - Prime publishes stronger scheduled-run lifecycle APIs.

  pylon-read-context:
    area: agent-context
    state: gap
    owner: pylon-server
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    fork_change: none
    upstream_support: not applicable
    revisit_when:
      - Pylon ships scoped read-only context and checkpoint MCP capabilities.

  prime-inference-catalog-capabilities:
    area: model-catalog
    state: shipped
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/4
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1878
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1876
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1877
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1633
    fork_change: route-specific-live-pricing-invariants
    upstream_support: Prime refreshes the generated catalog from live providers and currently pins sampled vendor prices in tests.
    revisit_when:
      - Prime adopts deterministic catalog fixtures or repo-owned structural invariants.
      - Prime stops regenerating vendor pricing before tests and releases.

  kernel-protocol-test-fixtures:
    area: runtime-reliability
    state: shipped
    owner: upstream
    decision: adopt
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/4
      - https://github.com/pylon-code/prime-agent/pull/5
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1839
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1882
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1886
    fork_change: none
    upstream_support: "Prime PR #1882 landed the same protocol-3 fixture repair that Pylon had adopted ahead from PR #1886; there is no remaining behavioral fork."
    revisit_when:
      - "Prime changes the kernel protocol or its real-process fixture contract again."

  snapshot-recovery-integrity:
    area: runtime-reliability
    state: shipped
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/11
      - https://github.com/pylon-code/prime-agent/pull/14
      - https://github.com/pylon-code/prime-agent/issues/21
      - https://github.com/pylon-code/prime-agent/pull/19
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/issues/1229
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1845
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1847
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1756
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1864
    fork_change: immutable-snapshot-transfer-isolated-retry-and-fresh-generation-v1
    upstream_support: Prime through c382f09856d4 still lacks a capability-gated fresh snapshot-generation identity, attachment-local retry containment, and bounded large-transcript framing that preserve a healthy resident worker across mixed-version catch-up failures.
    revisit_when:
      - Prime gives every mixed-version transfer immutable bytes and a unique generation identity while preserving the event cursor as ordering metadata.
      - Prime isolates one malformed or changing snapshot generation without recycling the healthy worker and bounds preparation, framing, drain waits, and spill ownership.

  authoritative-owned-session-cleanup:
    area: runtime-reliability
    state: shipped
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/11
      - https://github.com/pylon-code/prime-agent/pull/14
      - https://github.com/pylon-code/pylon/issues/114
      - https://github.com/rynfar/comet/issues/5
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1756
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1858
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1864
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1882
    fork_change: negotiated-authoritative-owned-session-cleanup-v1
    upstream_support: Prime through a903d4b6768f has recovery-aware reuse, owner-checked opens, bounded daemon-close bash draining, per-command abort ownership, client-owned sessions, and best-effort owner cleanup, but another host process cannot prove exact worker-generation and durable-descriptor absence after the owner connection disappears.
    revisit_when:
      - Prime upstream exposes an equivalent privacy-safe, capability-negotiated cleanup proof with durable descriptor-last retries.
      - Comet and Pylon can remove the fork capability without weakening crash cleanup or stock-Prime fallback behavior.

  bounded-public-daemon-ingress:
    area: runtime-reliability
    state: shipped
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/13
      - https://github.com/pylon-code/prime-agent/pull/16
      - https://github.com/pylon-code/pylon/issues/114
      - https://github.com/rynfar/comet/issues/5
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/480
    fork_change: bounded-daemon-ingress-v1
    upstream_support: Prime through a903d4b6768f has an optional decoded-character JSONL line limit with prefix callbacks and discard/resume behavior, but its public DaemonClient does not bound raw inbound frames or terminally reject recovery state before decode and parse.
    revisit_when:
      - Prime upstream exposes an equivalent public-root SDK proof, finite raw-byte default and override, privacy-safe typed terminal error, and no-replay reconnect semantics.
      - Comet and Pylon can remove the fork token without weakening stock-package fail-closed detection or host memory bounds.

  negotiated-daemon-session-capabilities:
    area: runtime-reliability
    state: shipped
    owner: shared
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/17
      - https://github.com/pylon-code/prime-agent/pull/18
      - https://github.com/pylon-code/pylon/issues/190
      - https://github.com/pylon-code/pylon/pull/191
      - https://github.com/rynfar/comet/issues/7
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/a903d4b6768f484bd6d459b7b0aa7dee38e461e2
    fork_change: negotiated-daemon-session-capabilities-v1
    upstream_support: Prime through a903d4b6768f has no correlated prompt lifecycle and no public post-attach negotiated-capability proof; the Pylon fork attach result already carries the daemon-established client capability set but its public connection exposes only the server hello offer.
    revisit_when:
      - Prime upstream exposes an equivalent generation-scoped, post-attach public proof that is false before attach and after invalidation.
      - Pylon and Comet can remove the fork SDK token/accessor without enabling optional behavior from a server offer, version, or method presence.

  child-scoped-provider-identity:
    area: runtime-reliability
    state: shipped
    owner: pylon-prime-integration
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/22
      - https://github.com/pylon-code/prime-agent/issues/23
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/a903d4b6768f484bd6d459b7b0aa7dee38e461e2
    fork_change: child-scoped-provider-identity-v1
    upstream_support: Prime through a903d4b6768f constructs inline RLM children and side questions with the root session's onPayload/onResponse closures, and calls compaction, branch summarization, and refinement completeSimple with no payload hook. Every derived request therefore either claims the parent's provider session identity while sending a divergent history or arrives with no identity at all.
    revisit_when:
      - Prime routes subagent and derived-request provider hooks through the owning session's extension runner.
      - An upstream extension contract exposes per-agent provider identity that supersedes the scoped session-id view.
  kind-aware-provider-retry:
    area: runtime-reliability
    state: shipped
    owner: pylon-prime-integration
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/22
      - https://github.com/pylon-code/prime-agent/issues/24
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/a903d4b6768f484bd6d459b7b0aa7dee38e461e2
    fork_change: kind-aware-session-retry-v1
    upstream_support: Prime through a903d4b6768f classifies provider stream failures but retries every one of them on the same fixed 2s/4s/8s ladder, stacks provider SDK retries underneath the session loop, never reads Retry-After, and threads maxRetryDelayMs through StreamOptions, Agent, and the proxy without any provider reading it.
    revisit_when:
      - Prime upstream makes the session retry loop failure-kind aware and honors Retry-After with a delay ceiling.
      - Prime upstream makes exactly one retry layer own policy so provider SDK retries cannot multiply session retries.

  turn-scoped-subagent-cancellation:
    area: runtime-reliability
    state: candidate
    owner: pylon-prime-integration
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/22
      - https://github.com/pylon-code/prime-agent/issues/25
      - https://github.com/pylon-code/prime-agent/pull/35
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/346
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/464
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1253
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/c382f09856d4a8c8d2b765179657047d58691f25
    fork_change: candidate
    upstream_support: Prime through c382f09856d4 keeps two cancel semantics. `AgentSession.requestAbort()` deliberately leaves active RLM child runs alive (PR #346 pinned that with a characterization test) while only `abort()` and `abortForUpdateRestart()` cascade, and every user-facing cancel path routes through `requestAbort()`. PR #464 made per-child cancellation explicit but never bound it to a turn abort, and open PR #1253 scopes child cancellation to kernel host teardown only. No upstream contract cancels the children a cancelled turn owns.
    revisit_when:
      - Prime makes a user-facing turn abort cancel the child runs it owns, or exposes an equivalent turn-scoped cancellation contract.
      - Prime introduces a real detached or background spawn mode, which would need a per-child survival decision instead of one retained-versus-active rule.

  stable-prompt-cache-prefix:
    area: prompt-ownership
    state: shipped
    owner: shared
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/22
      - https://github.com/pylon-code/prime-agent/issues/26
      - https://github.com/pylon-code/prime-agent/pull/32
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/commit/4b9e6006fad553dcca5aa69b23a039088064589f
      - https://github.com/PrimeIntellect-ai/prime-agent/commit/f81acc6679ab214f1c40821588d9e5e97c47bdb1
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/c382f09856d4a8c8d2b765179657047d58691f25
    fork_change: stable-prompt-cache-prefix-v1
    upstream_support: Prime through c382f09856d4 reduced the system-prompt date to a day stamp for cache stability, but it still serializes mutable continual-harness state and that date into the cached system prompt, has no provider-neutral volatile-content channel, and does not pin active tool order behind the `cache_control` marker on the last tool definition.
    revisit_when:
      - Prime upstream provides an equivalent provider-neutral channel that keeps mutable state and clock-derived content out of the cached tools/system/history prefix.
      - Pylon can drop the fork behavior without regressing measured cache-hit rates through a Claude-Max proxy.
