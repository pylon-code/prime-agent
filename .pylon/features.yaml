schema: 1
fork:
  repository: https://github.com/pylon-code/prime-agent
  upstream_repository: https://github.com/PrimeIntellect-ai/prime-agent
  upstream_branch: main
  mirror_branch: main
  product_branch: pylon
  tracking_issue: https://github.com/pylon-code/prime-agent/issues/1
  reviewed_upstream_commit: 1eee2938b4eeb7a4d72e17035adda669a89b63de
  reviewed_at: 2026-09-10

decisions:
  managed-plan-daemon:
    area: progress
    state: shipped
    owner: pylon-server
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
      - https://github.com/pylon-code/pylon/issues/126
      - https://github.com/pylon-code/pylon/pull/116
    fork_change: none
    upstream_support: Prime extensions can register a todo tool, but the daemon has no native managed-plan event.
    revisit_when:
      - Prime ships a negotiated structured plan event or equivalent managed tool-result contract.
      - Pylon behavioral evaluation shows the full-snapshot model is too noisy or unreliable.

  managed-plan-acp:
    area: progress
    state: gap
    owner: pylon-prime-integration
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    fork_change: candidate
    upstream_support: ACP does not expose a trustworthy Pylon-managed structured plan result.
    revisit_when:
      - Prime adds authenticated extension provenance and structured ACP tool-result metadata.
      - A standard ACP plan protocol becomes available.

  mobile-plan-rendering:
    area: progress
    state: gap
    owner: pylon-client
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    fork_change: none
    upstream_support: not applicable
    revisit_when:
      - Pylon mobile and web share a provider-neutral plan renderer.

  delegated-work-progress:
    area: progress
    state: design
    owner: pylon-client-runtime
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
      - https://github.com/pylon-code/pylon/issues/126
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1700
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1845
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1847
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1859
    fork_change: possible-capability
    upstream_support: Prime exposes separate subagent lifecycle with unified legacy recovery, one child projection, activity-driven quiescence, and single-send remote-message failure containment, but not Pylon's provider-neutral root progress model.
    revisit_when:
      - Root progress can summarize delegated phases without creating one plan row per worker.
      - Prime exposes a stable aggregate delegated-work status where Pylon lacks one.

  background-process-lifecycle:
    area: autonomous-work
    state: gap
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1858
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1882
    fork_change: candidate
    upstream_support: Prime has native background execution, per-command abort ownership, and daemon-close bash draining, but Pylon lacks complete public lifecycle and ownership mapping.
    revisit_when:
      - Prime publishes list, correlation, cancellation, and terminal lifecycle events.


  correlated-prompt-lifecycle:
    area: prompt-ownership
    state: shipped
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/3
      - https://github.com/pylon-code/prime-agent/pull/9
      - https://github.com/pylon-code/prime-agent/pull/12
      - https://github.com/pylon-code/pylon/issues/114
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/800
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1239
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1700
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1756
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1859
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1861
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1864
    fork_change: negotiated-correlated-prompt-lifecycle-v1
    upstream_support: Prime through a903d4b6768f has queue, background, cancellation, reconnect, single-send remote messages, recovery-aware reuse, activity-fenced continuations, owner-checked opens, and event primitives, but no optional contract proving per-prompt ownership, delivery, provenance, terminal usage, and durable generation-scoped recovery together.
    revisit_when:
      - Prime upstream ships an equivalent negotiated lifecycle with exact delivery, provenance, scoped cancellation, recovery, and per-prompt usage guarantees.
      - Pylon can remove the fork contract without weakening stock-Prime fallback behavior.

  heartbeat-projection:
    area: autonomous-work
    state: blocked
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1857
    fork_change: none-yet
    upstream_support: Prime exposes heartbeat list, management, and change APIs and now derives scoped heartbeat state at render time.
    blocker: Pylon needs canonical autonomous occurrence, turn, checkpoint, and active-run ownership.
    revisit_when:
      - The provider-neutral autonomous-work ownership model is implemented.
      - Prime changes heartbeat dispatch or lifecycle APIs.

  scheduled-prompts:
    area: autonomous-work
    state: blocked
    owner: shared
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    fork_change: candidate
    upstream_support: Prime exposes scheduled prompt APIs, but not all Pylon run ownership and history guarantees.
    blocker: Pylon needs canonical occurrence identity, restart adoption, cancellation, outcomes, limits, and checkpoint ownership.
    revisit_when:
      - The provider-neutral autonomous-work ownership model is implemented.
      - Prime publishes stronger scheduled-run lifecycle APIs.

  pylon-read-context:
    area: agent-context
    state: gap
    owner: pylon-server
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/pylon/issues/114
    fork_change: none
    upstream_support: not applicable
    revisit_when:
      - Pylon ships scoped read-only context and checkpoint MCP capabilities.

  prime-inference-catalog-capabilities:
    area: model-catalog
    state: shipped
    owner: upstream
    decision: adopt
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/4
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1878
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1876
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1877
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1633
    fork_change: none
    upstream_support: Prime v0.9.4 provides the current catalog, runtime refresh and deterministic ordinary builds; adopt the upstream catalog and its tests.
    revisit_when:
      - Upstream catalog generation or ordinary builds start depending on live vendor responses again.

  kernel-protocol-test-fixtures:
    area: runtime-reliability
    state: shipped
    owner: upstream
    decision: adopt
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/4
      - https://github.com/pylon-code/prime-agent/pull/5
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1839
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1882
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1886
    fork_change: none
    upstream_support: "Prime PR #1882 landed the same protocol-3 fixture repair that Pylon had adopted ahead from PR #1886; there is no remaining behavioral fork."
    revisit_when:
      - "Prime changes the kernel protocol or its real-process fixture contract again."

  snapshot-recovery-integrity:
    area: runtime-reliability
    state: shipped
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/11
      - https://github.com/pylon-code/prime-agent/pull/14
      - https://github.com/pylon-code/prime-agent/issues/21
      - https://github.com/pylon-code/prime-agent/pull/19
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/issues/1229
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1845
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1847
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1756
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1864
      - https://github.com/PrimeIntellect-ai/prime-agent/issues/1940
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/2044
    fork_change: immutable-snapshot-transfer-isolated-retry-and-fresh-generation-v1
    upstream_support: Prime v0.9.4 supplies snapshot catch-up, but runtime resync envelopes lose worker replay metadata. Preserve immutable transfer identities and isolated retries while carrying the actual worker replay through supervisor caching, inline resync and streamed snapshots under existing event_sequence negotiation; missing worker metadata remains unavailable.
    revisit_when:
      - Prime gives every mixed-version transfer immutable bytes and a unique generation identity while preserving the event cursor as ordering metadata.
      - Prime isolates one malformed or changing snapshot generation without recycling the healthy worker and bounds preparation, framing, drain waits, and spill ownership.

  authoritative-owned-session-cleanup:
    area: runtime-reliability
    state: shipped
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/11
      - https://github.com/pylon-code/prime-agent/pull/14
      - https://github.com/pylon-code/pylon/issues/114
      - https://github.com/rynfar/comet/issues/5
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1756
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1858
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1864
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1882
    fork_change: negotiated-authoritative-owned-session-cleanup-v1
    upstream_support: Prime through a903d4b6768f has recovery-aware reuse, owner-checked opens, bounded daemon-close bash draining, per-command abort ownership, client-owned sessions, and best-effort owner cleanup, but another host process cannot prove exact worker-generation and durable-descriptor absence after the owner connection disappears.
    revisit_when:
      - Prime upstream exposes an equivalent privacy-safe, capability-negotiated cleanup proof with durable descriptor-last retries.
      - Comet and Pylon can remove the fork capability without weakening crash cleanup or stock-Prime fallback behavior.

  bounded-public-daemon-ingress:
    area: runtime-reliability
    state: shipped
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/13
      - https://github.com/pylon-code/prime-agent/pull/16
      - https://github.com/pylon-code/pylon/issues/114
      - https://github.com/rynfar/comet/issues/5
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/480
    fork_change: bounded-daemon-ingress-v1
    upstream_support: Prime through a903d4b6768f has an optional decoded-character JSONL line limit with prefix callbacks and discard/resume behavior, but its public DaemonClient does not bound raw inbound frames or terminally reject recovery state before decode and parse.
    revisit_when:
      - Prime upstream exposes an equivalent public-root SDK proof, finite raw-byte default and override, privacy-safe typed terminal error, and no-replay reconnect semantics.
      - Comet and Pylon can remove the fork token without weakening stock-package fail-closed detection or host memory bounds.

  negotiated-daemon-session-capabilities:
    area: runtime-reliability
    state: shipped
    owner: shared
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/17
      - https://github.com/pylon-code/prime-agent/pull/18
      - https://github.com/pylon-code/pylon/issues/190
      - https://github.com/pylon-code/pylon/pull/191
      - https://github.com/rynfar/comet/issues/7
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/a903d4b6768f484bd6d459b7b0aa7dee38e461e2
    fork_change: negotiated-daemon-session-capabilities-v1
    upstream_support: Prime through a903d4b6768f has no correlated prompt lifecycle and no public post-attach negotiated-capability proof; the Pylon fork attach result already carries the daemon-established client capability set but its public connection exposes only the server hello offer.
    revisit_when:
      - Prime upstream exposes an equivalent generation-scoped, post-attach public proof that is false before attach and after invalidation.
      - Pylon and Comet can remove the fork SDK token/accessor without enabling optional behavior from a server offer, version, or method presence.

  child-scoped-provider-identity:
    area: runtime-reliability
    state: shipped
    owner: pylon-prime-integration
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/22
      - https://github.com/pylon-code/prime-agent/issues/23
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/a903d4b6768f484bd6d459b7b0aa7dee38e461e2
    fork_change: child-scoped-provider-identity-v1
    upstream_support: Prime v0.9.4 adds retry and summary-call identities, but derived calls still need the owning session extension payload hook. Preserve scoped identity for RLM children, side questions, both split compaction calls, branch summaries and refinement.
    revisit_when:
      - Prime routes subagent and derived-request provider hooks through the owning session's extension runner.
      - An upstream extension contract exposes per-agent provider identity that supersedes the scoped session-id view.
  kind-aware-provider-retry:
    area: runtime-reliability
    state: shipped
    owner: upstream
    decision: adopt
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/22
      - https://github.com/pylon-code/prime-agent/issues/24
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/a903d4b6768f484bd6d459b7b0aa7dee38e461e2
    fork_change: sse-retry-after-propagation-only
    upstream_support: Prime v0.9.4 unifies provider retry policy, honors bounded Retry-After delays and removes stacked SDK retries. Retain only Anthropic SSE Retry-After extraction where the in-stream error supplies a more specific delay.
    revisit_when:
      - Upstream preserves an Anthropic SSE error Retry-After value with the same precedence as its transport headers.

  turn-scoped-subagent-cancellation:
    area: runtime-reliability
    state: shipped
    owner: pylon-prime-integration
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/22
      - https://github.com/pylon-code/prime-agent/issues/25
      - https://github.com/pylon-code/prime-agent/pull/35
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/346
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/464
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/1253
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/c382f09856d4a8c8d2b765179657047d58691f25
    fork_change: turn-scoped-subagent-cancellation-v1
    upstream_support: Prime through c382f09856d4 keeps two cancel semantics. `AgentSession.requestAbort()` deliberately leaves active RLM child runs alive (PR #346 pinned that with a characterization test) while only `abort()` and `abortForUpdateRestart()` cascade, and every user-facing cancel path routes through `requestAbort()`. PR #464 made per-child cancellation explicit but never bound it to a turn abort, and open PR #1253 scopes child cancellation to kernel host teardown only. No upstream contract cancels the children a cancelled turn owns.
    revisit_when:
      - Prime makes a user-facing turn abort cancel the child runs it owns, or exposes an equivalent turn-scoped cancellation contract.
      - Prime introduces a real detached or background spawn mode, which would need a per-child survival decision instead of one retained-versus-active rule.

  stable-prompt-cache-prefix:
    area: prompt-ownership
    state: shipped
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/22
      - https://github.com/pylon-code/prime-agent/issues/26
      - https://github.com/pylon-code/prime-agent/pull/36
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/commit/4b9e6006fad553dcca5aa69b23a039088064589f
      - https://github.com/PrimeIntellect-ai/prime-agent/commit/f81acc6679ab214f1c40821588d9e5e97c47bdb1
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/c382f09856d4a8c8d2b765179657047d58691f25
    fork_change: stable-prompt-cache-prefix-v1
    upstream_support: Prime v0.9.4 persists compact harness digests at cold context boundaries. Adopt that durable history model while retaining provider-neutral volatile date placement, appendOnlyHistory model parsing and append-only placement, plus stable active-tool order.
    revisit_when:
      - Prime upstream provides an equivalent provider-neutral channel that keeps mutable state and clock-derived content out of the cached tools/system/history prefix, including a declared constraint for append-only-history backends.
      - Pylon can drop the fork behavior without regressing measured cache-hit rates through a Claude-Max proxy or Meridian lineage continuation rates.

  parent-session-identity:
    area: runtime-reliability
    state: shipped
    owner: pylon-prime-integration
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/22
      - https://github.com/pylon-code/prime-agent/issues/34
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/c718bf3c30fd8da206ed551837cbb54f7ad15948
    fork_change: parent-session-identity-v1
    upstream_support: Prime through c718bf3c30fd knows a subagent's parent only as in-memory daemon runtime metadata and as trace headers derived by walking the parentSession file pointer. Its session header has no parentSessionId, ReadonlySessionManager has no getParentSessionId, and parentSession also records fork and new-session lineage, so no extension-visible surface can name the agent that spawned a session.
    revisit_when:
      - Prime records a spawn-only parent session id in the session header or exposes an equivalent accessor on the extension-visible session manager.
      - The proxy-side parent-tree cancellation registry in rynfar/meridian#902 stops needing the parent edge inside the provider payload.

  caller-owned-session-environment-cleanup:
    area: runtime-reliability
    state: shipped
    owner: shared
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/33
      - https://github.com/pylon-code/pylon/issues/199
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/a903d4b6768f484bd6d459b7b0aa7dee38e461e2
    fork_change: caller-owned-session-environment-cleanup-v1
    upstream_support: Prime upstream does not expose a frozen caller-owned exact-environment contract, secret-free current-attachment proof, or bounded structured cleanup result that survives worker and supervisor replacement without weakening owner isolation.
    revisit_when:
      - Prime upstream exposes an equivalent public-root token, exact caller environment reuse, generation-scoped post-attach proof, and structured bounded cleanup outcomes.
      - Pylon can remove the fork token without weakening native multi-instance isolation or its pre-create ACP fallback.

  recoverable-owned-session-adoption:
    area: runtime-reliability
    state: shipped
    owner: shared
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/27
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/c718bf3c30fd8da206ed551837cbb54f7ad15948
      - https://github.com/PrimeIntellect-ai/prime-agent/tree/46c60b7500923be9e77022cb85c731241f35e2ac
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/2044
    fork_change: recoverable-owned-session-adoption-v1
    upstream_support: Prime upstream does not expose capability-gated same-supervisor adoption of an existing caller-owned worker with private rotating authority, prepare/commit proof, authoritative snapshot fencing, ordered event reconciliation, and in-place MCP ownership transfer. Current upstream SDK session events also discard daemon event cursors; retain exact per-event cursor forwarding through the existing validated SDK dispatch so consumers can durably record accepted transcript progress.
    revisit_when:
      - Prime upstream exposes an equivalent frozen public SDK token, detached-daemon capability, non-enumerating failure contract, same-generation rotating authority, staged proof, and explicit durability confirmation.
      - Pylon can remove the fork token without weakening caller-owned worker continuity, event ordering, credential privacy, or owner isolation.

  deterministic-pylon-release-artifacts:
    area: distribution
    state: candidate
    owner: pylon-fork
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/28
      - https://github.com/pylon-code/prime-agent/issues/29
      - https://github.com/pylon-code/pylon/issues/114
      - https://github.com/pylon-code/pylon/issues/193
      - https://github.com/pylon-code/pylon/issues/194
    fork_change: deterministic-self-contained-pylon-release-artifacts-v2
    upstream_support: Prime's R2 packer accepts mutable channel and archive inputs, refreshes live model catalogs during normal builds, retains upstream package provenance, and does not produce a Pylon-owned deterministic manifest or integrity-complete internal artifact graph.
    revisit_when:
      - Pylon no longer maintains a Prime distribution or the upstream artifact recipe can emit the exact fork-owned deterministic contract without publication side effects.
      - The source, recipe, toolchain, manifest, internal URL, and digest invariants can be preserved without fork-specific release code.

  protected-pylon-publication:
    area: distribution
    state: candidate
    owner: pylon-fork
    decision: redesign
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/29
      - https://github.com/pylon-code/prime-agent/issues/53
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/32
    fork_change: protected-publication-with-inode-bound-consumer-generations-v3-and-upload-policy-3
    upstream_support: Prime's inherited publication path targets upstream R2 and npm channels and does not provide canonical Pylon-only exact-SHA admission, six immutable preview subjects, byte-preserving manual promotion, signed monotonic stable history, or append-only withdrawal.
    revisit_when:
      - Prime ships a repository-neutral immutable release and promotion primitive that preserves Pylon's exact source, workflow, attestation, stable-history, and withdrawal policy without upstream credentials or channel names.
      - Pylon adopts another verifiable distribution transport that fully supersedes GitHub immutable Releases.

  runtime-reliability-september-followup:
    area: runtime-reliability
    state: candidate
    owner: upstream
    decision: adopt
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/69
      - https://github.com/pylon-code/pylon/issues/114
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/commit/90ca4a457e0fef0bd925215d4c973abd6264f067
      - https://github.com/PrimeIntellect-ai/prime-agent/commit/8eaa00c37385c6b25fed9d46584b50ffc2e87f9c
      - https://github.com/PrimeIntellect-ai/prime-agent/commit/7d1913969d33fa5a31366321e3f5db0070dcf2bf
    fork_change: selective-kernel-idle-codex-reliability
    upstream_support: Absorb kernel pipe errors, park blocked idle waiters, and retry stale Codex continuation IDs once before output; retain Pylon lifecycle, cancellation, scoped identity, recovery cursors and ownership without wire changes.
    revisit_when:
      - The next complete upstream integration includes these commits; reconcile the selective patches without duplicating behavior.

  compiled-installer-boundary:
    area: distribution
    state: shipped
    owner: pylon-fork
    decision: retain
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/67
      - https://github.com/pylon-code/pylon/issues/557
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/2140
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/2165
      - https://github.com/PrimeIntellect-ai/prime-agent/pull/2166
    fork_change: retain-immutable-sdk-distribution
    upstream_support: Compiled CLI archives and npm migration do not provide an importable Node SDK or Pylon signed immutable selection. Retain recipe 2, disabled stock self-update for distribution packages, and Pylon-owned maintenance.
    revisit_when:
      - Compiled distribution can preserve the public SDK, owned daemon contract, signed immutable source selection and Pylon maintenance ownership together.

  opencode-maintenance-routing:
    area: provider-identity
    state: candidate
    owner: shared
    decision: hybridize
    pylon_refs:
      - https://github.com/pylon-code/prime-agent/issues/65
      - https://github.com/pylon-code/prime-agent/issues/23
    upstream_refs:
      - https://github.com/PrimeIntellect-ai/prime-agent/commit/66658d2cf73153340f23133fbc16eafac31423e8
    fork_change: maintenance-session-routing-with-scoped-payload-hooks
    upstream_support: Pass the owning session to provider completion options for maintenance routing while retaining Pylon scoped payload hooks and independent summary request identities.
    revisit_when:
      - Upstream provides both owning-session routing and scoped auxiliary payload identity without replacing the fork hooks.
