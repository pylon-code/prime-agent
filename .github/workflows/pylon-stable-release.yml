            const deletionRules = Array.isArray(rules) ? rules.filter((rule) => rule?.type === "deletion") : [];
            const expectedIncludes = ["refs/tags/pylon-build-*", "refs/tags/pylon-stable-*"];
            const stableReservationRef = "refs/tags/pylon-stable-sequence-000001";
            const stableReservationCovered = Array.isArray(includes) && includes.some((pattern) =>
