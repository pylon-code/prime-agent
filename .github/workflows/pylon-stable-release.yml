              !draft.draft || draft.immutable === true || draft.tag_name !== process.env.STABLE_TAG ||
              draft.name !== `Pylon Prime stable ${process.env.STABLE_TAG}` || draft.prerelease !== false ||
              draft.target_commitish !== process.env.STABLE_SHA || bytes.toString("base64") !== encoded ||
              bytes.length !== Number(encodedSize) || digest !== encodedDigest || digest !== process.env.EXPECTED_MANIFEST_SHA256 ||
              draft.assets?.length !== 1 || asset.name !== "pylon-stable-channel-v1.json" ||
