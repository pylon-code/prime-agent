      - name: Require exact refs, draft, and live pylon before final publish ruleset audit
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          DRAFT_ID: ${{ steps.transaction.outputs.draft_id }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
          RESERVATION_TAG: ${{ steps.transaction.outputs.reservation_tag }}
          RESERVATION_SHA: ${{ steps.transaction.outputs.reservation_sha }}
          STABLE_TAG: ${{ steps.transaction.outputs.stable_tag }}
          STABLE_SHA: ${{ steps.transaction.outputs.stable_sha }}
        with:
          script: |
            const crypto = require("node:crypto");
            const pylon = await github.rest.git.getRef({ ...context.repo, ref: "heads/pylon" });
            if (pylon.data.object.type !== "commit" || pylon.data.object.sha !== context.sha) {
              throw new Error("Stable transaction became stale before final publish ruleset audit.");
            }
            const reservation = await github.rest.git.getRef({ ...context.repo, ref: `tags/${process.env.RESERVATION_TAG}` });
            if (reservation.data.object.type !== "tag" || reservation.data.object.sha !== process.env.RESERVATION_SHA) {
              throw new Error("Stable reservation changed before final publish ruleset audit.");
            }
            const stable = await github.rest.git.getRef({ ...context.repo, ref: `tags/${process.env.STABLE_TAG}` });
            if (stable.data.object.type !== "commit" || stable.data.object.sha !== process.env.STABLE_SHA) {
              throw new Error("Stable tag changed before final publish ruleset audit.");
