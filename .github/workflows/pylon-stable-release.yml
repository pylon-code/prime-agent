              ruleset.source_type !== "Repository" || ruleset.source !== "pylon-code/prime-agent" ||
              ruleset.target !== "tag" || ruleset.enforcement !== "active" ||
              !Object.hasOwn(ruleset, "bypass_actors") || !Array.isArray(ruleset.bypass_actors) || ruleset.bypass_actors.length !== 0 ||
              !Object.hasOwn(ruleset, "current_user_can_bypass") || ruleset.current_user_can_bypass !== "never" ||
              !exactKeys(conditions, ["ref_name"]) || !exactKeys(refName, ["exclude", "include"]) ||
              !Array.isArray(excludes) || excludes.length !== 0 || !Array.isArray(includes) ||
              JSON.stringify([...includes].sort()) !== JSON.stringify(expectedIncludes) || !stableReservationCovered ||
              !Array.isArray(rules) || rules.length !== 2 || updateRules.length !== 1 || deletionRules.length !== 1 ||
              !exactKeys(updateRules[0], ["parameters", "type"]) ||
              !exactKeys(updateRules[0]?.parameters, ["update_allows_fetch_and_merge"]) ||
              updateRules[0]?.parameters?.update_allows_fetch_and_merge !== false ||
              !exactKeys(deletionRules[0], ["type"])
            ) throw new Error("Authoritative ruleset-auditor response is missing, redacted, or differs from the exact active non-bypassable immutable tag ruleset.");

      - name: Publish only the exact protected stable draft
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          DRAFT_ID: ${{ steps.transaction.outputs.draft_id }}
          RESERVATION_TAG: ${{ steps.transaction.outputs.reservation_tag }}
          RESERVATION_SHA: ${{ steps.transaction.outputs.reservation_sha }}
          STABLE_TAG: ${{ steps.transaction.outputs.stable_tag }}
          STABLE_SHA: ${{ steps.transaction.outputs.stable_sha }}
        with:
          script: |
            const crypto = require("node:crypto");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const draftId = Number(process.env.DRAFT_ID);
            if (`${owner}/${repo}` !== "pylon-code/prime-agent" || !Number.isSafeInteger(draftId) || draftId < 1) {
              throw new Error("Stable immutable publication identity is malformed.");
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: draftId, draft: false });
            const immutable = (await github.rest.repos.getRelease({ owner, repo, release_id: draftId })).data;
            const encoded = /^Manifest base64: ([A-Za-z0-9+/]+={0,2})$/m.exec(immutable.body ?? "")?.[1];
            const encodedSize = /^Manifest bytes: ([1-9][0-9]*)$/m.exec(immutable.body ?? "")?.[1];
            const encodedDigest = /^Manifest sha256: ([0-9a-f]{64})$/m.exec(immutable.body ?? "")?.[1];
            const bytes = encoded ? Buffer.from(encoded, "base64") : Buffer.alloc(0);
            const digest = crypto.createHash("sha256").update(bytes).digest("hex");
            if (bytes.toString("base64") !== encoded || bytes.length !== Number(encodedSize) || digest !== encodedDigest) {
              throw new Error("Published stable recovery envelope differs from its exact manifest bytes.");
            }
            const manifest = JSON.parse(bytes);
            const name = `Pylon Prime stable ${manifest.tag}`;
            if (
              immutable.immutable !== true || immutable.draft || immutable.tag_name !== process.env.STABLE_TAG || immutable.name !== name ||
              immutable.prerelease !== false || immutable.target_commitish !== process.env.STABLE_SHA ||
              manifest.tag !== process.env.STABLE_TAG || manifest.promotion?.policyCommit !== process.env.STABLE_SHA ||
              immutable.assets?.length !== 1 || immutable.assets[0].name !== "pylon-stable-channel-v1.json" ||
              immutable.assets[0].size !== bytes.length || immutable.assets[0].digest !== `sha256:${digest}`
            ) throw new Error("Stable release immutable postconditions differ from the reserved transaction.");
            const stable = await github.rest.git.getRef({ owner, repo, ref: `tags/${process.env.STABLE_TAG}` });
            if (stable.data.object.type !== "commit" || stable.data.object.sha !== process.env.STABLE_SHA) {
              throw new Error("Published stable tag differs from the exact policy commit.");
            }
            const reservation = await github.rest.git.getRef({ owner, repo, ref: `tags/${process.env.RESERVATION_TAG}` });
            if (reservation.data.object.type !== "tag" || reservation.data.object.sha !== process.env.RESERVATION_SHA) {
              throw new Error("Published stable reservation differs from its exact annotation.");
            }
            const releases = (await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 }))
              .filter((release) => /^pylon-stable-[0-9]{6}-g/.test(release.tag_name ?? ""));
            if (releases.filter((release) => release.tag_name === manifest.tag).length !== 1) {
              throw new Error("Stable publication did not retain one globally unique sequence.");
            }
