      - name: Create or refetch the exact protected stable tag
        if: steps.transaction.outputs.create_stable_tag == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          STABLE_TAG: ${{ steps.transaction.outputs.stable_tag }}
