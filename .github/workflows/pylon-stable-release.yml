            if (`${owner}/${repo}` !== "pylon-code/prime-agent" || !/^pylon-stable-[0-9]{6}-g[0-9a-f]{12}-r[1-9][0-9]*$/.test(tag ?? "") || !/^[0-9a-f]{40}$/.test(sha ?? "")) {
