            } catch (error) {
              if (error.status !== 404) throw error;
              stableRef = undefined;
            }
            const reservationTag = `pylon-stable-sequence-${String(manifest.sequence).padStart(6, "0")}`;
            const withdrawalLines = operation === "withdraw" ? [
              `Withdraw stable tag: ${manifest.promotion.revocation.stableTag}`,
              `Withdraw build tag: ${manifest.promotion.revocation.buildTag}`,
              `Withdraw reason: ${manifest.promotion.revocation.reason}`,
            ] : [];
            const reservationMessage = [
              "Pylon stable sequence reservation", `Sequence: ${String(manifest.sequence).padStart(6, "0")}`,
              `Policy: ${manifest.promotion.policyCommit}`, `Policy tree: ${manifest.promotion.policyTree}`,
              `Operation: ${operation}`, ...withdrawalLines, `Stable tag: ${manifest.tag}`, `Preview: ${manifest.build.previewTag}`,
              `Manifest: sha256:${digest}`, `Draft release: ${draft.id}`, "",
            ].join("\n");
            const reservationRefs = (await github.paginate(github.rest.git.listMatchingRefs, { owner, repo, ref: "tags/pylon-stable-sequence-", per_page: 100 }))
              .filter((ref) => /^refs\/tags\/pylon-stable-sequence-[0-9]{6}$/.test(ref.ref));
            const expectedPriorReservations = Array.from({ length: manifest.sequence - 1 }, (_, index) => index + 1);
            const priorReservations = reservationRefs.filter((ref) => Number(ref.ref.slice(-6)) < manifest.sequence).map((ref) => Number(ref.ref.slice(-6))).sort((a, b) => a - b);
            if (JSON.stringify(priorReservations) !== JSON.stringify(expectedPriorReservations)) throw new Error("Stable reservation history is not the exact N-1 prefix.");
            let reservation = reservationRefs.find((ref) => ref.ref === `refs/tags/${reservationTag}`);
            const requireReservation = async () => {
              if (!reservation || reservation.object.type !== "tag") throw new Error("Stable reservation is not one annotated tag.");
              const annotation = (await github.rest.git.getTag({ owner, repo, tag_sha: reservation.object.sha })).data;
              if (
                annotation.tag !== reservationTag || annotation.message !== reservationMessage ||
                annotation.object.type !== "commit" || annotation.object.sha !== manifest.promotion.policyCommit
              ) throw new Error("Stable reservation belongs to a different exact transaction.");
              return annotation;
            };
            let reservationSha;
            if (process.env.RESERVATION_PRESENT === "true") {
              if (mode !== "resume") throw new Error("Only explicit recovery may consume an existing reservation.");
              await requireReservation();
              reservationSha = reservation.object.sha;
            } else {
              if (reservation) throw new Error("A draft-only transaction found an unexpected sequence reservation; explicit reservation recovery is required.");
              const annotated = (await github.rest.git.createTag({
                owner, repo, tag: reservationTag, message: reservationMessage,
                object: manifest.promotion.policyCommit, type: "commit",
                tagger: {
                  name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com",
                  date: new Date().toISOString(),
                },
              })).data;
              if (!/^[0-9a-f]{40}$/.test(annotated.sha ?? "")) throw new Error("Stable reservation annotation lacks an exact object id.");
              reservationSha = annotated.sha;
            }
            core.setOutput("create_reservation", process.env.RESERVATION_PRESENT === "true" ? "false" : "true");
            core.setOutput("reservation_tag", reservationTag);
            core.setOutput("reservation_sha", reservationSha);
            core.setOutput("create_stable_tag", stableRef ? "false" : "true");
            core.setOutput("stable_tag", manifest.tag);
            core.setOutput("stable_sha", manifest.promotion.policyCommit);
            core.setOutput("draft_id", String(draft.id));

      - name: Mint repository-scoped ruleset auditor token
