        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RESERVATION_TAG;
            const sha = process.env.RESERVATION_SHA;
            if (`${owner}/${repo}` !== "pylon-code/prime-agent" || !/^pylon-stable-sequence-[0-9]{6}$/.test(tag ?? "") || !/^[0-9a-f]{40}$/.test(sha ?? "")) {
              throw new Error("Stable reservation CAS identity is malformed.");
            }
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            } catch (error) {
              if (error.status === 422) {
                try { await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` }); } catch {}
                throw new Error("Stable sequence reservation raced (422); refetched state and stopped without N+1, move, or delete.");
              }
              throw error;
            }

