      - name: Create the exact protected stable reservation ref
        if: steps.transaction.outputs.create_reservation == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RESERVATION_TAG: ${{ steps.transaction.outputs.reservation_tag }}
